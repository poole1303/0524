<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>MindAR 影片播放互動</title>

    <!-- A-Frame + MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
        }

        #hint {
            position: fixed;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div id="hint">請掃描圖片</div>

<a-scene
    mindar-image="imageTargetSrc: gem.mind; autoStart: true; uiScanning: true;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
>

    <!-- 影片 -->
    <a-assets>
        <video 
            id="introVid"
            src="sky.mp4"
            preload="auto"
            loop
            playsinline
            webkit-playsinline>
        </video>
    </a-assets>

    <!-- 光 -->
    <a-light type="ambient" intensity="1.5"></a-light>

    <!-- 相機 -->
    <a-camera look-controls="enabled: false"></a-camera>

    <!-- target -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">

        <a-video
            id="videoEntity"
            src="#introVid"
            width="0.8"
            height="1.2"
            position="0 0 0"
            material="shader: flat">
        </a-video>

    </a-entity>

</a-scene>

<script>
const video = document.querySelector('#introVid');
const videoPlane = document.querySelector('#videoEntity');
const target = document.querySelector('#target');
const hint = document.querySelector('#hint');

let found = false;

// iPhone 必要設定
video.muted = false;
video.volume = 1;

// 掃描到
target.addEventListener('targetFound', () => {
    found = true;
    hint.innerHTML = "掃描成功<br>點一下播放影片";
});

// 消失
target.addEventListener('targetLost', () => {
    found = false;
    video.pause();
    video.currentTime = 0;
    hint.innerHTML = "請重新掃描";
});

// 點擊播放（關鍵）
document.body.addEventListener('click', () => {

    if (!found) {
        hint.innerHTML = "請先掃描圖片";
        return;
    }

    video.play().then(()=>{
        hint.style.display = "none";
    }).catch(()=>{
        hint.innerHTML = "影片無法播放";
    });

});

// 點影片暫停
videoPlane.addEventListener('click', () => {
    if (video.paused) {
        video.play();
    } else {
        video.pause();
    }
});
</script>

</body>
</html>
